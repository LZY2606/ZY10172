[package]
name = "mastercurve-bench"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7.9", features = ["macros"] }
tokio = { version = "1.40", features = ["full"] }
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.210", features = ["derive"] }
serde_json = "1.0.128"
tower = "0.5.1"
tempfile = "3.12.0"

[dev-dependencies]
http-body-util = "0.1.2"
bytes = "1.7.2"
